name: Build riya bouu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip "$ZIP" -d extracted
          ROOT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          cp -a "$(dirname "$ROOT")"/. .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riya-bouu-apk
          path: app/build/outputs/apk/debug/*.apk
